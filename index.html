<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: cho giao diện tràn vào vùng "tai thỏ" của iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hóa phân tích</title>
  <meta name="description" content="Ôn tập Hóa phân tích: lý thuyết, bài tập, công cụ tính và bảng tra">

  <!-- Khai báo để cài được như app -->
  <!-- Chính sách nội dung: chỉ nạp mã / dữ liệu từ chính app và Google (Firebase, Google Sheets) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://docs.google.com https://*.googleusercontent.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f3efff">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">

  <!-- Dành riêng cho iPhone/iPad (Safari) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hóa phân tích">

  <link rel="stylesheet" href="vendor/be-vietnam-pro/fonts.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Thanh tiêu đề trên cùng -->
    <header class="topbar">
      <button class="icon-btn" id="nut-quay-lai" aria-label="Quay lại" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="tieu-de">Hóa phân tích</h1>
      <div class="tien-do-doc" id="tien-do-doc" hidden></div>
    </header>

    <!-- Nội dung từng màn hình được app.js vẽ vào đây -->
    <main class="content" id="noi-dung"></main>

    <!-- Thanh tab dưới đáy, giống app -->
    <nav class="tabbar">
      <a href="#/" data-tab="/">
        <img src="anh/3d/trang-chu.webp" alt="">
        <span>Trang chủ</span>
      </a>
      <a href="#/lop-hoc" data-tab="/lop-hoc" class="tab-gv" data-nhom="/lop /nhap-lop /ket-qua-lop /ket-qua-hoc-tap /giao-de /da-giao /bang-diem /so-diem">
        <img src="anh/3d/lop-hoc.webp" alt="">
        <span>Lớp học</span>
      </a>
      <a href="#/ly-thuyet" data-tab="/ly-thuyet">
        <img src="anh/3d/ly-thuyet.webp" alt="">
        <span>Lý thuyết</span>
      </a>
      <a href="#/bai-tap" data-tab="/bai-tap">
        <img src="anh/3d/luyen-tap.webp" alt="">
        <span>Bài tập</span>
      </a>
      <a href="#/tao-de" data-tab="/tao-de">
        <img src="anh/3d/tao-de.webp" alt="">
        <span>Tạo đề</span>
      </a>
      <a href="#/tra-cuu" data-tab="/tra-cuu">
        <img src="anh/3d/tra-cuu.webp" alt="">
        <span>Tra cứu</span>
      </a>
    </nav>
  </div>

  <!-- Hộp gợi ý "Cài app" (hiện khi trình duyệt cho phép) -->
  <div class="install-banner" id="goi-y-cai" hidden>
    <img src="icons/icon-192.png" alt="">
    <div class="install-text">
      <strong>Cài app lên điện thoại</strong>
      <span id="huong-dan-cai">Mở nhanh từ màn hình chính, dùng toàn màn hình.</span>
    </div>
    <button class="btn" id="nut-cai">Cài</button>
    <button class="icon-btn" id="nut-dong-goi-y" aria-label="Đóng">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- KaTeX: hiển thị công thức toán (lưu sẵn trong vendor/ để chạy cả khi mất mạng) -->
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/mhchem.min.js"></script>
  <script src="noi-dung.js"></script>
  <!-- Kho câu hỏi có khóa; file này nạp tiếp phan-dang.js, app.js, tao-de.js, Firebase, tai-khoan.js, giao-bai.js -->
  <script src="kho-khoa.js"></script>
</body>
</html>
