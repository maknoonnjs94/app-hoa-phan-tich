<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: cho giao diện tràn vào vùng "tai thỏ" của iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hóa phân tích</title>
  <meta name="description" content="Web giống app dùng trên điện thoại">

  <!-- Khai báo để cài được như app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">

  <!-- Dành riêng cho iPhone/iPad (Safari) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hóa phân tích">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Thanh tiêu đề trên cùng -->
    <header class="topbar">
      <button class="icon-btn" id="nut-quay-lai" aria-label="Quay lại" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="tieu-de">Trang chủ</h1>
    </header>

    <!-- Nội dung từng màn hình được app.js vẽ vào đây -->
    <main class="content" id="noi-dung"></main>

    <!-- Thanh tab dưới đáy, giống app -->
    <nav class="tabbar">
      <a href="#/" data-tab="/">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Trang chủ</span>
      </a>
      <a href="#/kham-pha" data-tab="/kham-pha">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Khám phá</span>
      </a>
      <a href="#/thong-bao" data-tab="/thong-bao">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
        <span>Thông báo</span>
      </a>
      <a href="#/ca-nhan" data-tab="/ca-nhan">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Cá nhân</span>
      </a>
    </nav>
  </div>

  <!-- Hộp gợi ý "Cài app" (hiện khi trình duyệt cho phép) -->
  <div class="install-banner" id="goi-y-cai" hidden>
    <img src="icons/icon-192.png" alt="">
    <div class="install-text">
      <strong>Cài app lên điện thoại</strong>
      <span id="huong-dan-cai">Mở nhanh từ màn hình chính, dùng toàn màn hình.</span>
    </div>
    <button class="btn" id="nut-cai">Cài</button>
    <button class="icon-btn" id="nut-dong-goi-y" aria-label="Đóng">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
